<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Hi, I'm Alvi. Computer Science and Engineering Student at American International University-Bangladesh. Interested in AI, ML and Computer Vision Research. itsfarhanalvi315@gmail.com">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2e3b"/>
      <stop offset="1" stop-color="#1F222E"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; }
    .m { opacity: 0; }
    .m1 { animation: k1 14s ease-out infinite; }
    .m2 { animation: k2 14s ease-out infinite; }
    .m3 { animation: k3 14s ease-out infinite; }
    .m4 { animation: k4 14s ease-out infinite; }
    .bub { fill: #1F222E; stroke: #3a3f55; stroke-width: 1; }
    .bub-hi { fill: #1F222E; stroke: #3a3f55; stroke-width: 1; }
    .bub-mail { fill: #1F222E; stroke: #00ff41; stroke-width: 1.2; }
    .t { fill: #e6edf3; }
    .t-hi { fill: #e6edf3; }
    .t-mail { fill: #00ff41; font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; }
    circle { stroke: #3a3f55; stroke-width: 1; }
    .av-t { fill: #e6edf3; font-weight: 700; font-size: 15px; }
    @keyframes k1 { 0%,3% {opacity:0; transform:translateY(14px)} 7%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k2 { 0%,23% {opacity:0; transform:translateY(14px)} 27%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k3 { 0%,43% {opacity:0; transform:translateY(14px)} 47%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k4 { 0%,63% {opacity:0; transform:translateY(14px)} 67%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
  </style>

  <g transform="translate(0,20)">
    <g class="m m1">
      <circle cx="30" cy="22" r="16" fill="url(#av)"/><text class="av-t" x="30" y="27.5" text-anchor="middle">A</text>
      <rect class="bub-hi" x="62" y="0" width="190" height="44" rx="20"/>
      <text class="t-hi" x="82" y="28">Hi, I'm Alvi 👋</text>
    </g>
  </g>

  <g transform="translate(0,76)">
    <g class="m m2">
      <circle cx="30" cy="22" r="16" fill="url(#av)"/><text class="av-t" x="30" y="27.5" text-anchor="middle">A</text>
      <rect class="bub" x="62" y="0" width="740" height="44" rx="20"/>
      <text class="t" x="82" y="28">Computer Science and Engineering Student at American International University-Bangladesh</text>
    </g>
  </g>

  <g transform="translate(0,132)">
    <g class="m m3">
      <circle cx="30" cy="22" r="16" fill="url(#av)"/><text class="av-t" x="30" y="27.5" text-anchor="middle">A</text>
      <rect class="bub" x="62" y="0" width="480" height="44" rx="20"/>
      <text class="t" x="82" y="28">Interested in AI, ML and Computer Vision Research</text>
    </g>
  </g>

  <g transform="translate(0,188)">
    <g class="m m4">
      <circle cx="30" cy="22" r="16" fill="url(#av)"/><text class="av-t" x="30" y="27.5" text-anchor="middle">A</text>
      <rect class="bub-mail" x="62" y="0" width="330" height="44" rx="20"/>
      <text class="t-mail" x="82" y="28">📧 itsfarhanalvi315@gmail.com</text>
    </g>
  </g>
</svg>
