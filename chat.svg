<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Hi, I'm Alvi. Computer Science and Engineering Student at American International University-Bangladesh. Interested in AI, ML and Computer Vision Research. itsfarhanalvi315@gmail.com" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f5af0"/>
      <stop offset="1" stop-color="#2cb67d"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; }
    .m { opacity: 0; }
    .m1 { animation: k1 18s ease-out infinite; }
    .m2 { animation: k2 18s ease-out infinite; }
    .m3 { animation: k3 18s ease-out infinite; }
    .m4 { animation: k4 18s ease-out infinite; }
    .bub { fill: #1F222E; stroke: #3a3f55; stroke-width: 1; }
    .bub-hi { fill: #0e75b6; stroke: #2a8fd0; stroke-width: 1; }
    .bub-mail { fill: #1F222E; stroke: #00ff41; stroke-width: 1.2; }
    .t { fill: #e6edf3; }
    .t-hi { fill: #ffffff; font-weight: 700; }
    .t-mail { fill: #00ff41; font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; }
    .av-t { fill: #ffffff; font-weight: 700; font-size: 15px; }
    @keyframes k1 { 0%,3% {opacity:0; transform:translateY(14px)} 7%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k2 { 0%,20% {opacity:0; transform:translateY(14px)} 24%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k3 { 0%,42% {opacity:0; transform:translateY(14px)} 46%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k4 { 0%,64% {opacity:0; transform:translateY(14px)} 68%,92% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
  </style>

  <g transform="translate(0,20)">
