<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Hi, I'm Alvi. Computer Science and Engineering Student at American International University-Bangladesh. Interested in AI, ML and Computer Vision Research. itsfarhanalvi315@gmail.com">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2e3b"/>
      <stop offset="1" stop-color="#1F222E"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; }
    .m, .ty { opacity: 0; }
    .m1 { animation: k1 15s ease-out infinite; }
    .m2 { animation: k2 15s ease-out infinite; }
    .m3 { animation: k3 15s ease-out infinite; }
    .m4 { animation: k4 15s ease-out infinite; }
    .y1 { animation: y1 15s linear infinite; }
    .y2 { animation: y2 15s linear infinite; }
    .y3 { animation: y3 15s linear infinite; }
    .y4 { animation: y4 15s linear infinite; }
    .bub { fill: #1F222E; stroke: #3a3f55; stroke-width: 1; }
    .bub-hi { fill: #1F222E; stroke: #3a3f55; stroke-width: 1; }
    .bub-mail { fill: #1F222E; stroke: #00ff41; stroke-width: 1.2; }
    .tail { fill: #1F222E; stroke: #3a3f55; stroke-width: 1; }
    circle { stroke: #3a3f55; stroke-width: 1; }
    .t { fill: #e6edf3; }
    .t-hi { fill: #e6edf3; }
    .t-mail { fill: #00ff41; font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; }
    .av-t { fill: #e6edf3; font-weight: 700; font-size: 15px; }
    .dot { fill: #9aa3b5; stroke: none; animation: dot 1s ease-in-out infinite; }
    .d2 { animation-delay: .15s; }
    .d3 { animation-delay: .3s; }
    @keyframes dot { 0%,80%,100% { opacity: .3 } 40% { opacity: 1 } }
    @keyframes y1 { 0%,1% {opacity:0} 2%,8% {opacity:1} 9%,100% {opacity:0} }
    @keyframes y2 { 0%,21% {opacity:0} 22%,28% {opacity:1} 29%,100% {opacity:0} }
    @keyframes y3 { 0%,41% {opacity:0} 42%,48% {opacity:1} 49%,100% {opacity:0} }
    @keyframes y4 { 0%,61% {opacity:0} 62%,68% {opacity:1} 69%,100% {opacity:0} }
    @keyframes k1 { 0%,10% {opacity:0; transform:translateY(14px)} 13%,93% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k2 { 0%,30% {opacity:0; transform:translateY(14px)} 33%,93% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k3 { 0%,50% {opacity:0; transform:translateY(14px)} 53%,93% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
    @keyframes k4 { 0%,70% {opacity:0; transform:translateY(14px)} 73%,93% {opacity:1; transform:translateY(0)} 97%,100% {opacity:0; transform:translateY(0)} }
  </style>

  <!-- Row 1 -->
  <g transform="translate(0,20)">
    <g class="ty y1">
      <circle cx="30" cy="22" r="16" fill="url(#av)"/><text class="av-t" x="30" y="27.5" text-anchor="middle">A</text>
      <rect class="bub" x="62" y="0" width="76" height="44" rx="22"/>
      <circle class="tail" cx="58" cy="48" r="3.2"/>
      <circle class="dot" cx="87" cy="22" r="4.5"/><circle class="dot d2" cx="102" cy="22" r="4.5"/><circle class="dot d3" cx="117" cy="22" r="4.5"/>
    </g>
    <g class="m m1">
      <circle cx="30" cy="22" r="16" fill="url(#av)"/><text class="av-t" x="30" y="27.5" text-anchor="middle">A</text>
      <rect class="bub-hi" x="62" y="0" width="190" height="44" rx="20"/>
      <text class="t-hi" x="82" y="28">Hi, I'm Alvi 👋</text>
    </g>
  </g>

